<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#160f2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ブレイン脱獄">
  <meta name="format-detection" content="telephone=no">
  <title>ブレイン脱獄</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app"></main>
  <noscript>JavaScript をオンにしてね。</noscript>
  <script type="module" src="js/main.js"></script>
  <!-- 起動できなかったとき（ファイルの読みこみ失敗など）の非常口。勉強の記録（localStorage）は消さない -->
  <script>
    setTimeout(function () {
      if (window.__booted) return;
      var el = document.getElementById('app');
      el.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#fff;font-size:17px;line-height:1.7">'
        + '<p style="font-size:40px;margin:0">🔧</p><p>アプリを起動できませんでした。<br>ファイルがそろっていないか、古いファイルが残っているかも。</p>'
        + '<p style="font-size:14px;color:#c9c2e8">勉強の記録・💎・コレクションは消えません。</p>'
        + '<button id="rescue" style="font-size:18px;padding:14px 22px;border-radius:14px;border:0;background:#ffd640;color:#1b1236;font-weight:800">🔄 読みこみ直す</button></div>';
      document.getElementById('rescue').onclick = function () {
        var done = function () { location.replace('./?v=' + Date.now()); };
        var p = [];
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(p).then(done, done);
      };
    }, 8000);
  </script>
</body>
</html>
